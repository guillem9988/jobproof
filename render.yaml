services:
  - type: web
    name: jobproof
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      # Public deployments must run in hosted mode: no imports, no settings, no real AI.
      - key: HOSTED_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////tmp/jobproof-hosted.db
      # "true" lets visitors use their own AI key in a private, expiring workspace (see docs/security.md).
      - key: HOSTED_BYOK
        value: "false"
      # Set to your frontend origin, e.g. https://jobproof-web.vercel.app (not "*").
      - key: ALLOWED_ORIGINS
        sync: false
