services:
  - type: web
    name: jobproof
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "gemini"
      - key: LLM_MODEL
        value: "gemini-3.8-flash"
