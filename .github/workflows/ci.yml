name: CI

on:
  push:
    branches: [main, public-release]
  pull_request:
    branches: [main, public-release]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Lint with Ruff
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Pytest
        run: |
          pytest backend/tests/

  frontend:
    name: Frontend Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          pnpm test

      - name: Build Frontend
        run: |
          cd frontend
          pnpm build
